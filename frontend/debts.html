<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget App - Debts</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        .debt-progress-bar {
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 5px;
        }

        .debt-progress {
            height: 20px;
            background-color: #4CAF50;
            border-radius: 5px;
            text-align: center;
            color: white;
            line-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Debts</h1>
        <nav>
            <a href="/static/dashboard.html">Dashboard</a>
            <a href="/static/transactions.html">Transactions</a>
            <a href="/static/categories.html">Categories</a>
        </nav>

        <form id="debt-form">
            <input type="hidden" id="debt-id">
            
            <label for="name">Debt Name:</label>
            <input type="text" id="name" required>

            <label for="total-balance">Total Balance:</label>
            <input type="number" id="total-balance" step="0.01" required>

            <label for="current-balance">Current Balance:</label>
            <input type="number" id="current-balance" step="0.01" required>

            <label for="interest-rate">Interest Rate (optional):</label>
            <input type="number" id="interest-rate" step="0.01">

            <label for="minimum-payment">Minimum Payment (optional):</label>
            <input type="number" id="minimum-payment" step="0.01">

            <button type="submit">Add/Update Debt</button>
        </form>

        <div id="debts-list">
            <!-- Debts will be loaded here -->
        </div>

        <button id="logout-button">Logout</button>
    </div>
    <script src="./js/auth.js"></script>
    <script src="./js/debts.js"></script>
</body>
</html>
