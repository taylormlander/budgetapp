<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget App - Categories</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        .debt-progress-bar {
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 5px;
        }
        .debt-progress {
            height: 20px;
            background-color: #4CAF50;
            border-radius: 5px;
            text-align: center;
            color: white;
            line-height: 20px;
            min-width: 30px;
        }
        .category-item.debt-category {
            border-left: 4px solid #e74c3c;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .template-group {
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
        }
        .template-group h4 {
            margin: 0 0 8px 0;
            color: #333;
        }
        .template-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .template-item:hover {
            background-color: #f0f0f0;
        }
        .template-item input[type="checkbox"] {
            margin-right: 10px;
        }
        .template-item .color-swatch {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 8px;
            display: inline-block;
        }
        .template-item .icon-preview {
            margin-right: 8px;
        }
        .add-templates-btn {
            margin-left: 10px;
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .add-templates-btn:hover {
            background-color: #2980b9;
        }
        .modal-actions {
            margin-top: 15px;
            text-align: right;
        }
        .modal-actions button {
            margin-left: 10px;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Categories</h1>
        <form id="category-form">
            <input type="hidden" id="category-id">
            <input type="text" id="category-name" placeholder="Category Name" required>
            <input type="color" id="category-color" value="#cccccc">
            <input type="text" id="category-icon" placeholder="Icon (e.g., fa-solid fa-pizza-slice)">
            <input type="text" id="category-folder-group" placeholder="Folder Group (optional)">
            <button type="submit">Add/Update Category</button>
            <button type="button" class="add-templates-btn" id="browse-templates-btn">Browse Templates</button>
        </form>
        <nav>
            <a href="/static/dashboard.html">Dashboard</a>
            <a href="/static/transactions.html">Transactions</a>
            <a href="/static/debts.html">Debts</a>
        </nav>
        <div id="categories-list">
            <!-- Categories will be loaded here -->
        </div>
        <button id="logout-button">Logout</button>
    </div>

    <!-- Templates Modal -->
    <div id="templates-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <h2>Add Categories from Templates</h2>
            <p>Select categories to add to your budget:</p>
            <div id="template-groups">
                <!-- Template groups will be loaded here -->
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn-primary" id="modal-add-selected">Add Selected</button>
            </div>
        </div>
    </div>

    <script src="./js/categories.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
